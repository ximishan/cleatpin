# Publish the playable v1 client to GitHub Pages.
# Upload and deploy are separate jobs. deploy-pages lists artifacts only after
# the uploading job has finished; doing both in one job finds zero artifacts.
# The site is index.html, js/, and the bundled fonts. Paths stay relative.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble playable site
        run: |
          mkdir -p _site/js _site/fonts
          cp index.html _site/index.html
          cp js/engine.js js/ui.js js/main.js _site/js/
          cp fonts/Baloo2-700.woff2 fonts/Nunito-700.woff2 _site/fonts/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
